<!-- ===================== VIDEO MODAL ===================== -->

<div
    id="videoModal"
    class="fixed inset-0 z-[9999]
           hidden
           bg-black/80
           flex items-center justify-center
           p-4"
    onclick="closeVideo(event)"
>

    <!-- Close Button -->
    <button
        type="button"
        onclick="closeVideo()"
        class="absolute top-5 right-6
               text-white text-4xl
               font-light
               hover:text-[#BE9448]
               transition
               z-[10000]"
        aria-label="Close video"
    >
        &times;
    </button>


    <!-- Video -->
    <div
        class="relative w-full
               max-w-[1260px]
               aspect-video
               bg-black
               shadow-2xl"
        onclick="event.stopPropagation()"
    >

        <iframe
            id="videoPlayer"
            class="absolute inset-0
                   w-full h-full"
            src=""
            title="Nesto Video"
            referrerpolicy="strict-origin-when-cross-origin"
            allow="accelerometer;
                   autoplay;
                   clipboard-write;
                   encrypted-media;
                   gyroscope;
                   picture-in-picture;
                   web-share"
            allowfullscreen>
        </iframe>

    </div>

</div>

<!-- ===================== TAB ANIMATION ===================== -->

<style>

    .tab-content.tab-active {
        animation: tabFadeIn 0.45s ease forwards;
    }


    @keyframes tabFadeIn {

        from {
            opacity: 0;
            transform: translateY(15px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }

    }

</style>


<!-- ===================== JAVASCRIPT ===================== -->

<script>

document.addEventListener("DOMContentLoaded", function () {


    /* =====================================================
       ELEMENTS
    ===================================================== */

    const tabButtons = document.querySelectorAll(".tab-btn");

    const tabContents = document.querySelectorAll(".tab-content");

    const newsGrid = document.getElementById("newsGrid");


    /* =====================================================
       TAB SWITCHING
    ===================================================== */

    function switchTab(targetTab) {


        /*
         * Change active button
         */

        tabButtons.forEach(function (button) {

            const isActive =
                button.dataset.tab === targetTab;


            if (isActive) {

                button.classList.remove(
                    "bg-white",
                    "text-gray-900"
                );

                button.classList.add(
                    "bg-gold",
                    "text-white"
                );

            } else {

                button.classList.remove(
                    "bg-gold",
                    "text-white"
                );

                button.classList.add(
                    "bg-white",
                    "text-gray-900"
                );

            }

        });


        /*
         * Hide all content
         */

        tabContents.forEach(function (content) {

            content.classList.add("hidden");

            content.classList.remove("tab-active");

        });


        /*
         * Show selected content
         */

        const selectedContent =
            document.getElementById(targetTab);


        if (selectedContent) {

            selectedContent.classList.remove("hidden");

            /*
             * Force browser to restart animation
             */
            void selectedContent.offsetWidth;

            selectedContent.classList.add("tab-active");

        }

    }
    

    /* =====================================================
       TAB CLICK EVENTS
    ===================================================== */

    tabButtons.forEach(function (button) {

        button.addEventListener("click", function () {

            const targetTab =
                button.dataset.tab;

            switchTab(targetTab);

        });

    });


    /* =====================================================
       NEWS & EVENTS DATA
    ===================================================== */

    const newsItems = [

        {
            img: "{% static 'images/news/news-image-1.jpg' %}",
            title: "Nesto Group supports '1 Billion Meals Endowment' campaign wit...",
            date: "December 26, 2023"
        },

        {
            img: "{% static 'images/news/news-image-2.jpg' %}",
            title: "Nesto unveils 100th store",
            date: "December 26, 2023"
        },

        {
            img: "{% static 'images/news/news-image-3.jpg' %}",
            title: "Nesto Introduces Wallet Option on Inaam App for Instant Rewards",
            date: "March 18, 2024"
        },

        {
            img: "{% static 'images/news/news-image-4.jpg' %}",
            title: "Nesto Partners with Tabby to Offer Convenient Pay in 4 Option",
            date: "March 18, 2024"
        },

        {
            img: "{% static 'images/news/news-image-5.jpg' %}",
            title: "Nesto Hypermarket Celebrates 126th Philippine Independence...",
            date: "June 24, 2024"
        },

        {
            img: "{% static 'images/news/New-image-6.jpg' %}",
            title: "Nesto Hypermarket Celebrates Successful Tropicool Festival",
            date: "July 5, 2024"
        },

        {
            img: "{% static 'images/news/news-image-7.jpg' %}",
            title: "Nesto Group UAE Wins Large Retailer of the Year",
            date: "September 25, 2024"
        },

        {
            img: "{% static 'images/news/news-image-8.jpg' %}",
            title: "Nesto Hypermarket Celebrates Successful Participation",
            date: "September 25, 2024"
        },

        {
            img: "{% static 'images/news/news-image-9.jpg' %}",
            title: "Nesto Hypermarket opens 129th outlet, Bilad Mall in Oman",
            date: "September 30, 2024"
        },

        
    ];


    /* =====================================================
       RENDER NEWS
    ===================================================== */

    if (newsGrid) {

        newsGrid.innerHTML = newsItems
            .map(function (item) {

                return `

                    <article class="group cursor-pointer">

                        <div class="overflow-hidden rounded-md">

                            <img
                                src="${item.img}"
                                alt="${item.title}"
                                class="w-full
                                       aspect-[8/5]
                                       object-cover
                                       group-hover:scale-105
                                       transition-transform
                                       duration-500"
                                loading="lazy"
                            />

                        </div>


                        <h3
                            class="text-white
                                   font-semibold
                                   text-[15px]
                                   sm:text-base
                                   mt-4
                                   leading-snug
                                   line-clamp-2
                                   group-hover:text-gold
                                   transition-colors"
                        >
                            ${item.title}
                        </h3>


                        <div
                            class="flex items-center
                                   justify-between
                                   mt-3"
                        >

                            <span class="text-gray-500 text-[13px]">
                                ${item.date}
                            </span>


                            <a
                                href="#"
                                class="text-red-600
                                       text-[13px]
                                       font-bold
                                       inline-flex
                                       items-center
                                       gap-1.5"
                            >
                                Read More

                                <span
                                    class="transition-transform
                                           group-hover:translate-x-1"
                                >
                                    &rarr;
                                </span>

                            </a>

                        </div>

                    </article>

                `;

            })
            .join("");

    }


    
    

    switchTab("news");


});


function openVideo(videoId) {

    const modal = document.getElementById("videoModal");
    const player = document.getElementById("videoPlayer");

    // Set YouTube video
    player.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1&rel=0";

    // Show modal
    modal.classList.remove("hidden");

    // Prevent background scrolling
    document.body.style.overflow = "hidden";
}


function closeVideo(event) {

    // If clicking inside the video container, don't close
    if (
        event &&
        event.target !== document.getElementById("videoModal")
    ) {
        return;
    }

    const modal = document.getElementById("videoModal");
    const player = document.getElementById("videoPlayer");

    // Stop video
    player.src = "";

    // Hide modal
    modal.classList.add("hidden");

    // Enable scrolling again
    document.body.style.overflow = "";
}


// Close with ESC key
document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {
        closeVideo();
    }

});



</script>

{% endblock %}
