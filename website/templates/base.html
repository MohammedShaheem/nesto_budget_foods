{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}Budget Foods{% endblock %}
    </title>

    
    <link
        rel="icon"
        type="image/png"
        href="{% static 'images/favicon.png' %}"
    >

    
    <link
        rel="stylesheet"
        href="{% static 'css/output.css' %}"
    >

    
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap"
        rel="stylesheet"
    >

    <style>

        .btn-gold {
            background: #BE9448;
            color: #1c1c1c;
            padding: 0.6rem 1.8rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            display: inline-block;
            transition: opacity .2s ease;
        }

        .btn-gold:hover {
            opacity: .85;
        }

        .btn-outline {
            border: 1px solid #fff;
            color: #fff;
            padding: 0.55rem 1.7rem;
            border-radius: 9999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

    </style>

</head>


<body class="text-[#333] font-sans bg-white">

    {% include "includes/header.html" %}


    <main class="pt-10">

        {% block content %}
        {% endblock %}

    </main>


    {% include "includes/footer.html" %}

</body>

</html>
